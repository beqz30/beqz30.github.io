<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindAR WebAR Experience</title>

  <!-- A-Frame, MindAR และ A-Frame Extras -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <!-- ระบบตรวจจับการแสดงโมเดลเพื่อควบคุมเสียง -->
  <script>
    AFRAME.registerComponent('play-sound-on-target', {
      init: function () {
        const audio = document.querySelector('#voice-sound');
        const target = this.el;
        let isModelShowing = false;

        // ปลดล็อกระบบเสียงของเบราว์เซอร์อัตโนมัติในพื้นหลังเมื่อแตะจอ
        const unlock = () => {
          if (audio) {
            audio.play().then(() => {
              if (!isModelShowing) {
                audio.pause();
                audio.currentTime = 0;
              }
            }).catch(() => {});
          }
          window.removeEventListener('touchstart', unlock);
          window.removeEventListener('click', unlock);
        };
        window.addEventListener('touchstart', unlock, { once: true });
        window.addEventListener('click', unlock, { once: true });

        // เล่นเสียงวนลูปทันทีที่ส่องเจอโมเดล
        target.addEventListener('targetFound', () => {
          isModelShowing = true;
          if (audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log('Wait for interaction:', e));
          }
        });

        // หยุดเสียงทันทีที่ภาพหลุดโฟกัส
        target.addEventListener('targetLost', () => {
          isModelShowing = false;
          if (audio) {
            audio.pause();
          }
        });
      }
    });
  </script>
</head>

<body style="margin: 0; overflow: hidden;">
  <a-scene
    mindar-image="imageTargetSrc: https://beqz30.github.io/targets (2).mind; maxTrack: 5;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="model0" src="https://beqz30.github.io/3d_computer__-_sketchfab_weekly_-_11_mar23.glb"></a-asset-item>

      <!-- โหลดไฟล์เสียงพร้อมตั้งค่าวนลูป (loop) -->
      <audio id="voice-sound" src="https://beqz30.github.io/พากย์แนะนำคณะ.mp3" preload="auto" loop></audio>
    </a-assets>

    <!-- Target 1 -->
    <a-entity mindar-image-target="targetIndex: 0" play-sound-on-target>
      <a-gltf-model src="#model0" animation-mixer scale="0.03 0.03 0.03"></a-gltf-model>
    </a-entity>

    <!-- Target 2 -->
    <!--<a-entity mindar-image-target="targetIndex: 1">
      <a-gltf-model src="#model1" animation-mixer rotation="90 0 0" scale="2 2 2"></a-gltf-model>
    </a-entity>-->

    <!-- Target 3 -->
    <!--<a-entity mindar-image-target="targetIndex: 2">
      <a-gltf-model src="#model2" animation-mixer rotation="90 0 0" scale="0.5 0.5 0.5"></a-gltf-model>
    </a-entity>-->

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  </a-scene>
</body>
</html>
